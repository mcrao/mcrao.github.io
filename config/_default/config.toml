# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish" # UNCOMMENT THIS LINE
baseURL = "https://mcrao.github.io/"
defaultContentLanguage = "en"
disableLanguages = ['pt-pt']

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 30

buildDrafts = false
buildFuture = false

enableEmoji = true

googleAnalytics = "G-63MWPTT5MM"

timeout = "300s"

[pagination]
  pagerSize = 27

[params.author]
  name = "Manoj"
  image = "blowfish_pic.png"
  headline = "ML Engineer"
  subtitle = "🧠 GenAI · LLM · Agents"
  bio = "ML Engineer @ 7-Eleven"
  links = [
  { bluesky = "https://bsky.app/profile/mchra0.bsky.social" },
  { github = "https://github.com/mcrao" },
  { linkedin = "https://linkedin.com/in/themanojchandrashekar" }
  ]

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
